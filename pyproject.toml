[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-mail"
version = "1.0.2"
description = "Official Python SDK for Lumi Email Infrastructure"
readme = "README.md"
authors = [
  { name = "Lumi", email = "team@lumi.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
  "requests>=2.28.0",
  "typing-extensions>=4.0.0",
]
keywords = ["email", "transactional-email", "lumi", "sdk", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://lumi.com"
Documentation = "https://lumi.com/docs"
Repository = "https://github.com/deveterim/lumi-python"
"Bug Tracker" = "https://github.com/deveterim/lumi-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumi*"]

[tool.setuptools.package-data]
lumi = ["py.typed"]
